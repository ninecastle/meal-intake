<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA(2026-11-01 사용자 요청): 홈 화면에 추가하면 앱처럼 열린다. 아이폰은 manifest 대신 아래 apple-* 태그를 본다.
         theme-color 메타는 두지 않는다(브라우저 주소 표시줄 색은 그대로, 설치한 앱만 manifest 색) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Intake" />
    <!-- 글꼴 Jua(디자인 시안과 같음, 굵기 400 하나). 글꼴 파일은 gstatic에서 받으므로 그쪽도 미리 연결한다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <title>Intake</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
