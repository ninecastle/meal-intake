<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA(2026-11-01 사용자 요청): 홈 화면에 추가하면 앱처럼 열린다. 아이폰은 manifest 대신 아래 apple-* 태그를 본다.
         theme-color 메타는 두지 않는다(브라우저 주소 표시줄 색은 그대로, 설치한 앱만 manifest 색) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="식단 기록" />
    <!-- 글꼴 Pretendard(2026-11-02 사용자 요청, 시안의 Jua 대신). 가변 굵기 한 벌, 화면에 나온 글자 묶음만 받는다(dynamic subset). -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>식단 기록</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
