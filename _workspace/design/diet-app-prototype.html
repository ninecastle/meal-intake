<title>식단 기록 앱 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one phone-width column; home is three pastel bands (sky → lime → peach) stacked as the user scrolls. Single light look by choice. */
:root{
  color-scheme: light;
  --ground:#F3F6F4;
  --surface:#FFFFFF;
  --ink:#1F2A2E;
  --ink-2:#5D6B70;
  --ink-3:#8A979B;
  --line:#E3EAE7;
  --sky:#8DC0E3; --sky-deep:#4783AD; --sky-soft:#D9EBF7;
  --lime:#B1DA86; --lime-deep:#57902E; --lime-soft:#E4F2D4;
  --peach:#F3AF80; --peach-deep:#C0612A; --peach-soft:#FAE2D0;
  --butter:#F1D364; --butter-soft:#F7EBBC;
  --carb:#4F8DB5; --prot:#E0A02A; --fat:#E27FA3;
  --heat0:#EEF2EF; --heat1:#D6EBC0; --heat2:#B1DA86; --heat3:#7FBE4C; --heat4:#F3AF80;
  --crown:#D9A21B;
  --f-num:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-head:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
*{font-weight:400!important}
svg text{font-family:var(--f-body)}
input{font-family:var(--f-body)!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3,h4,b,.chipbtn,.btn,.tab,.segment button,.linkrow button,.state,.todaypill,.dow,.nchip,.fn,.weight .q,.remain,.ratio div,.bar label,.badge,.gmeal b,.sgroup,.srow,.choice button,.school p,.gcard .kc,.mtotal,.leftcard b,.rec b,.callout b,.more,.meal .empty{font-family:var(--f-head);font-weight:400!important}
.nrow,.rank li,.rank .meta,.food,.mgrams>div{font-family:var(--f-head)}
.donut{position:relative;width:210px;height:210px;margin:6px auto 0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .dc .num{font-size:36px;font-weight:600;line-height:1}
.donut .dc span:last-child{font-size:15px;color:var(--ink-2);font-family:var(--f-head)}
.mgrams small{display:block;font-family:var(--f-num);font-size:14px;color:var(--ink-2)}
.scale{display:block;width:220px;max-width:100%;height:auto;margin:18px auto 0}
.app{max-width:430px;margin:0 auto;min-height:100%;background:var(--surface);position:relative;box-shadow:0 0 0 1px var(--line)}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen{padding-bottom:120px}

/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;height:56px;padding-block:6px}
.topbar h1{font-size:17px;font-weight:800;margin:0}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{background:var(--ground)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:5}

/* date strip */
.datestrip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:4px 14px}
.dside{display:flex;align-items:center;gap:6px;color:var(--ink-3);min-height:44px;font-size:18px}
.dside.r{justify-content:flex-end}
.dside .num{font-size:20px;font-weight:600}
.dow{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink-2)}
.dcenter{display:flex;align-items:center;gap:8px}
.dcenter .num{font-size:26px;font-weight:700}
.todaypill{background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:4px 11px}

/* bands */
.band{padding-block:28px 32px}
.band.sky{background:var(--sky-soft)}
.band.lime{background:var(--lime-soft)}
.band.peach{background:var(--peach-soft)}
.bandhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.bandhead h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em}
.seg-mini{display:flex;gap:6px}
.chipbtn{min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);color:var(--ink)}
.chipbtn.dark{background:var(--ink);color:#fff}

.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding-top:8px}
.ring .big{font-size:38px;font-weight:700;line-height:1}
.ring .unit{font-size:15px;font-weight:600;color:var(--ink-2)}
.ring .sub{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.ratio{display:grid;gap:10px}
.ratio div{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ratio .num{margin-left:auto;font-size:22px}
.ratio small{font-size:13px;color:var(--ink-2);font-weight:600}

.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px}
.bar label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.track{height:8px;border-radius:99px;background:rgba(31,42,46,.08);overflow:hidden}
.fill{height:100%;border-radius:99px}
.bar .num{display:block;margin-top:6px;font-size:15px;font-weight:600}
.bar .num span{color:var(--ink-3)}
.remain{margin-top:22px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;text-align:center;font-weight:700}
.remain .num{color:var(--lime-deep);font-size:20px}
.minor{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:13px;color:var(--ink-2)}

/* meals grid */
.meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.meal{background:var(--surface);border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px}
.meal .mtop{display:flex;justify-content:space-between;align-items:flex-start}
.meal .plus svg{width:24px;height:24px;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;fill:none;display:block}
.meal .plus{width:48px!important;height:48px!important;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--ink)}
.meal h3{margin:0;font-size:17px;font-weight:800}
.meal .mk{font-size:20px;font-weight:700}
.meal .mfood{font-size:13px;color:var(--ink);opacity:.75;margin-top:-6px}
.meal .empty{font-size:13px;color:var(--ink);opacity:.6}
.meal:hover{box-shadow:0 0 0 3px rgba(31,42,46,.15)}
.meal{position:relative}
.mealhit{position:absolute;inset:0;border-radius:inherit;z-index:0}
.meal>*:not(.mealhit){position:relative;z-index:1;pointer-events:none}
.meal>.skip{pointer-events:auto;align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:40px;font-family:var(--f-head);font-size:15px;color:var(--ink);opacity:.55;margin-top:auto}
.skip .ck{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.skip .ck svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.meal>.skip.on{opacity:1}
.skip.on .ck{background:var(--ink)}
.skip.on .ck svg{stroke:#fff}
.tmeal{padding-block:10px 18px}
.thead{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;margin-bottom:-12px}
.thead h3{margin:0;font-size:16px}
.tk{font-size:30px;font-weight:600;line-height:1.2}
.tcard{border-radius:24px;padding:26px 20px 20px;display:grid;gap:14px}
.tcard .badges i{background:var(--surface)}
.tfoods{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tfoods li{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-head)}
.tempty{display:grid;justify-items:center;gap:6px;padding:12px 0;color:var(--ink);opacity:.55;font-family:var(--f-head)}
.cell.hw{background:var(--sky-soft)}
.kedit{display:grid;gap:10px;justify-items:center;width:100%}
.krow{display:flex;align-items:center;gap:12px}
.kstep{width:48px;height:48px;border-radius:50%;background:var(--surface);font-size:26px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.kval{display:flex;align-items:baseline;gap:4px}
.kval input{width:4.2ch;border:0;border-bottom:3px solid var(--lime-deep);background:none;font-size:48px;text-align:center;color:var(--ink);padding:0;-moz-appearance:textfield;appearance:textfield}
.kval input::-webkit-inner-spin-button,.kval input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.kval span{font-size:20px;color:var(--ink-2)}
.kmeta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;min-height:44px;font-size:14px;color:var(--ink-2);text-align:center}
.kcust{background:var(--butter-soft);color:#7A5C0C;padding:2px 10px;border-radius:999px;white-space:nowrap}
.kinfo{font-size:13px;color:var(--ink-2);text-align:center}
.kwhy{margin:0;font-size:14px;color:var(--lime-deep);text-align:center}
.kedit .macro3{width:100%}
.macro3 small{display:block;color:var(--ink-3);font-size:13px}
.sheet .macro3>div{background:var(--ground)}
.macro3>div{text-align:center}
.terms h4{margin:18px 0 6px;font-size:16px}
.terms ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2);font-size:15px;line-height:1.5}
.shot{position:relative;border-radius:14px;overflow:hidden;min-width:0}
.shot svg{display:block;width:100%;height:auto}
.shot>span{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 8px;font-size:12px;color:var(--ink)}
.coach-modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.coach-modal h3{margin:0 0 12px;font-size:21px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tips{list-style:none;padding:0;margin:14px 0 16px;display:grid;gap:9px}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45}
.tck{width:22px;height:22px;border-radius:50%;background:var(--lime-soft);display:grid;place-items:center;flex:none;margin-top:1px}
.tck svg{width:14px;height:14px;stroke:var(--lime-deep);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.album-pair .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob{padding-bottom:150px}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none;height:100%}
html.lock .app{height:100%}
html.lock .ob{height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}
html.lock .ob .dots{flex:none;margin:16px 0!important}
html.lock .slides{touch-action:pan-x;flex:none;min-height:0}
html.lock .slide{padding-block:20px 4px;align-content:center}
html.lock .slide .art{width:min(100%,360px,48vh)}
html.lock .slide .art svg[aria-label="앱 마스코트"]{width:130px;height:auto}
html.lock .slide .micowrap{width:160px!important;height:160px!important}
html.lock .slide .micowrap .mico{width:120px!important;height:120px!important}
html.lock .slide h2{font-size:25px}
html.lock .dots{margin-top:12px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;justify-items:center;gap:16px;text-align:center;padding-block:36px 6px}
.slide .art{width:100%;max-width:320px;aspect-ratio:1/.9;border-radius:32px;display:grid;place-items:center}
.slide h2{margin:0;font-size:27px;line-height:1.3;text-wrap:balance}
.slide p{margin:0;color:var(--ink-2);font-size:16px}
.dots{display:flex;justify-content:center;margin-top:16px}
.dots>div{display:flex;align-items:center;gap:2px;background:var(--ground);border-radius:99px;padding:4px 8px}
.dots button{height:28px;padding:0 4px;display:grid;place-items:center}
.dots button::after{content:"";display:block;width:8px;height:8px;border-radius:99px;background:#C9D3CF;transition:width .35s cubic-bezier(.3,.7,.2,1),background .35s}
.dots button[aria-current="true"]::after{width:28px;background:var(--lime-deep)}
.link{min-height:48px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.progress{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-block:10px 4px}
.pfill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:var(--lime-deep);transition:width .5s cubic-bezier(.3,.7,.2,1)}
.pfill::after{content:"";position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.75)}
.pticks i{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--surface)}
.q h2{font-size:27px;margin:26px 0 6px;line-height:1.3}
.q .help{color:var(--ink-2);margin:0 0 22px;min-height:1em}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:62px;border-radius:var(--r-md);background:var(--ground);display:flex;align-items:center;padding:8px 18px;font-size:18px;text-align:left;border:2px solid transparent}
.opt small{color:var(--ink-3);font-size:14px;display:block}
.opt[aria-pressed="true"]{background:var(--lime-soft);border-color:var(--lime-deep)}
.field{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--lime-deep);padding-block:6px}
.field input{flex:1;min-width:0;border:0;background:none;font-size:46px;color:var(--ink);outline:none}
.field span{font-size:22px;color:var(--ink-2)}
.note{margin-top:18px;background:var(--sky-soft);border-radius:var(--r-md);padding:12px 14px;font-size:15px;color:var(--ink-2)}
.allagree{background:var(--ground);border-radius:var(--r-md);padding:2px 14px;margin-bottom:8px}
.arow{display:flex;align-items:center;gap:8px}
.arow .lbl{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;text-align:left;font-size:16px}
.arow .view{color:var(--ink-3);font-size:14px;min-height:44px;padding:0 6px;text-decoration:underline;white-space:nowrap}
.cbox{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none}
.cbox svg{width:16px;height:16px;stroke:var(--surface);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cbox.on{background:var(--lime-deep)}
.tagreq,.tagopt{font-size:12px;padding:1px 7px;border-radius:6px;white-space:nowrap;flex:none}
.tagreq{color:var(--lime-deep);background:var(--lime-soft)}
.tagopt{color:var(--ink-3);background:var(--ground)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.rec-res{background:var(--lime-soft);border-radius:28px;padding:28px 18px;display:grid;gap:18px;text-align:center}
.rec-res .big{font-size:56px;line-height:1}
.macro3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.macro3>div{background:var(--surface);border-radius:var(--r-md);padding:12px 4px}
.macro3 .num{font-size:24px}
.gbtn{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.coach-block{position:fixed;inset:0;z-index:49}
.coach-hole{position:fixed;border-radius:22px;box-shadow:0 0 0 9999px rgba(31,42,46,.58);z-index:50;pointer-events:none;transition:all .25s}
.coach-tip{position:fixed;z-index:51;background:var(--surface);border-radius:20px;padding:16px;width:min(300px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.2)}
.coach-tip p{margin:0 0 12px;font-size:18px;line-height:1.4}
.crow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.crow>:first-child{justify-self:start}
.crow>:last-child{justify-self:end;padding:0 24px}
.micowrap{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 6px rgba(31,42,46,.08)}
.micowrap .mico{width:42px;height:42px}
.ratio div{font-size:17px}
.ratio .num{font-size:28px}
.ratio small{font-size:15px}
.bar label{font-size:15px}
.bar .num{font-size:19px}
.minor{font-size:15px}
.remain{font-size:17px}
.remain .num{font-size:24px}
.ring .big{font-size:46px}
.ring .unit{font-size:18px}
.ring .sub{font-size:14px}
.goalw{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:8px;font-family:var(--f-head);font-size:15px}
.goalw .num{font-size:17px}
.goalw .tag{background:var(--surface);border-radius:999px;padding:3px 10px;color:var(--peach-deep)}
.nchips{flex-wrap:wrap}
.mico{width:40px;height:40px}
.linkrow{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.linkrow button{min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.linkrow button+button{border-left:1px solid var(--line)}

/* weight */
.weight{text-align:center}
.weight .q{font-weight:700;color:var(--ink-2)}
.weight .kg{font-size:56px;font-weight:700;line-height:1.1}
.weight .kg span{font-size:22px;color:var(--ink-2)}
.weight .delta{font-size:14px;color:var(--peach-deep);font-weight:700}
.btn{min-height:52px;border-radius:999px;font-weight:800;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.peach{background:var(--peach);width:100%;margin-top:18px}
.btn.ink{background:var(--ink);color:#fff}
.btn.lime{background:var(--lime)}
.btn.sky{background:var(--sky)}
.btn.ghost{background:var(--ground)}

.crown{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;background:#FBF0CF;border-radius:50%}
.crown svg{width:14px;height:14px;fill:var(--crown)}
.todaypill,.dow,.chipbtn,.linkrow button,.tab,.segment button,.btn,.state,.nchip,.dside,.dcenter,.bandhead h2,.meal h3,.srow span{white-space:nowrap}
.dcenter .num{font-size:24px}
@media (max-width:380px){.dside .num{font-size:17px}.chipbtn{padding:0 11px}.datestrip{gap:4px}}

/* fixed bottom */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.bottom .inner{max-width:430px;margin:0 auto;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--surface) 70%,rgba(255,255,255,0));display:flex;gap:10px;pointer-events:auto}
.bottom .btn{flex:1}
.bottom .btn.narrow{flex:0 0 auto}

/* tabs */
.tabs{display:flex;gap:8px;padding-block:6px 18px}
.tab{min-height:42px;padding:0 16px;border-radius:999px;background:var(--ground);font-weight:700;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.segment{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--ground);border-radius:999px;padding:5px;gap:4px}
.segment button{min-height:44px;border-radius:999px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:4px}
.segment button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(31,42,46,.12)}

/* glance card */
.gcard{background:var(--sky);border-radius:28px;padding:28px 22px;display:grid;gap:22px;justify-items:center;text-align:center}
.gcard .kc{font-size:20px;font-weight:800}
.gcard .kc .num{font-size:34px}
.badges{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

function detail(){
  const fs=all(),t=totals(fs),p=pct(t);
  const rank=(key,label,g,emoji)=>{const v=t[key],ratio=v/g,st=ratio<.5?['부족해요','']:ratio<=1.1?['적당해요','ok']:['많아요','hi'];
    const sorted=[...fs].sort((a,b)=>b[key]-a[key]).filter(f=>f[key]>0);
    const rows=[0,1,2].map(i=>sorted[i]?`<li><span class="n num">${i+1}</span><span>${sorted[i].n}</span><span class="v num">${r1(sorted[i][key])}g<small>1회</small></span></li>`:`<li><span class="n num">${i+1}</span><span style="color:var(--ink-3)">-</span></li>`).join('');
    return `<section class="rank"><header><h3>${emoji}${label}</h3><span class="state ${st[1]}">${st[0]}</span></header>
      <div class="track"><div class="fill" style="width:${Math.min(ratio*100,100)}%;background:${key==='sug'?'var(--peach)':'var(--sky-deep)'}"></div></div>
      <div class="meta"><span><b class="num">${r1(v)}g</b> 먹었어요</span><span style="color:var(--ink-3)">${key==='sug'?'권장 ':'목표 '}<span class="num">${g}g</span></span></div>
      <ol>${rows}</ol>${sorted.length>3?'<button class="more">더 보기 ▾</button>':''}</section>`};
  const dot=c=>`<span class="dot" style="background:${c};display:inline-block;margin-right:6px"></span>`;
  const DR=78,DL=2*Math.PI*DR;let off=0;
  const seg=(v,col)=>{const len=Math.max(DL*v/100-5,0);const s=`<circle cx="105" cy="105" r="${DR}" fill="none" stroke="${col}" stroke-width="30" stroke-dasharray="${len} ${DL}" stroke-dashoffset="${-off}"/>`;off+=DL*v/100;return s};

function monthGrid(click,nut='kcal'){
  const fmt=(v,d)=>nut==='w'?(59.6-d*0.045).toFixed(1):nut==='c'?Math.round(v*240):nut==='p'?Math.round(v*100):nut==='f'?Math.round(v*55):Math.round(v*1900/10)*10;
  // Oct 2026: 1st is Thursday; Monday-start offset 3
  const vals={1:.82,2:.95,3:1.18,4:1.02,5:.6,6:.88,7:.97,8:.4,9:1.05,10:1.21,11:.93,12:.99,13:.72,14:.91,15:1.0,16:1.14,17:.86,18:.3,19:.96,20:1.03,21:.89,22:.94,23:1.12,24:.98,25:.77,26:.92,27:.47};
  const lv=v=>v==null?'':v<.5?'h1':v<.9?'h2':v<=1.1?'h3':'h4';
  let cells=['월','화','수','목','금','토','일'].map(d=>`<div class="wd">${d}</div>`).join('');
  [28,29,30].forEach(d=>cells+=`<div class="cell out">${d}</div>`);
  for(let d=1;d<=31;d++){const v=vals[d];cells+=`<button class="cell ${nut==='w'?(v?'hw':''):lv(v)} ${d===27?'today':''}" data-${click}="${d}" aria-label="10월 ${d}일${v?` 목표의 ${Math.round(v*100)}%`:''}"><span>${d}</span>${v?`<span class="v">${fmt(v,d)}</span>`:''}</button>`}
  cells+=`<div class="cell out">1</div>`;
  return `<div class="cal">${cells}</div>`;
}

function calendar(){
  const week=[[ '월',1820],['화',1960],['수',1690],['목',2130],['금',1860],['토',2290],['일',1470]];
  const W=320,H=170,pl=34,pr=40,pt=14,pb=26,max=2500,min=1000;
  const x=i=>pl+i*(W-pl-pr)/6, y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
  const avg=Math.round(week.reduce((a,b)=>a+b[1],0)/7);
  const line=week.map((d,i)=>`${i?'L':'M'}${x(i)} ${y(d[1])}`).join(' ');
  const weekSvg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 섭취 칼로리">
    ${[1000,1500,2000,2500].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${v}</text>`).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${y(1900)}" y2="${y(1900)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/><text x="${W-pr+4}" y="${y(1900)+4}" font-size="10" fill="var(--ink-2)">목표</text>
    <line x1="${pl}" x2="${W-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--peach-deep)" stroke-dasharray="2 4"/><text x="${W-pr+4}" y="${y(avg)+14}" font-size="10" fill="var(--peach-deep)">평균</text>
    <path d="${line}" fill="none" stroke="var(--lime-deep)" stroke-width="3" stroke-linejoin="round"/>
    ${week.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[1])}" r="${i===5?5:3.5}" fill="${i===5?'var(--lime-deep)':'var(--surface)'}" stroke="var(--lime-deep)" stroke-width="2"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${d[0]}</text>`).join('')}
  </svg>`;
  const month=[];for(let d=1;d<=27;d++)month.push(Math.round(1900*(.5+((d*37)%60)/100)));
  const mW=320,mH=150;const bw=(mW-34-8)/27;
  const monthSvg=`<svg viewBox="0 0 ${mW} ${mH}" role="img" aria-label="10월 일별 섭취 칼로리">
    ${[0,1000,2000,3000].map(v=>{const yy=10+(1-v/3000)*(mH-34);return `<line x1="34" x2="${mW-8}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="28" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${v}</text>`}).join('')}
    ${month.map((v,i)=>{const h=v/3000*(mH-34);return `<rect x="${34+i*bw+1}" y="${10+(mH-34)-h}" width="${bw-2}" height="${h}" rx="2" fill="${v>2090?'var(--peach)':'var(--lime)'}"/>`}).join('')}
    ${[1,8,15,22,27].map(d=>`<text x="${34+(d-1)*bw+bw/2}" y="${mH-6}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${d}일</text>`).join('')}
    <line x1="34" x2="${mW-8}" y1="${10+(1-1900/3000)*(mH-34)}" y2="${10+(1-1900/3000)*(mH-34)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
  </svg>`;
  const panes={
    week:`<div class="chartcard"><header><button class="chipbtn">◀ 지난주</button><h3 class="num">10.19 – 10.25</h3><button class="chipbtn" style="color:var(--ink-3)">다음 주 ▶</button></header>${weekSvg}
      <div class="callout"><b>토요일</b> 섭취 <b class="num">2,290kcal</b> · 목표 대비 <b class="num">121%</b> · 주 평균 <span class="num">${avg.toLocaleString()}kcal</span> 대비 <b class="num">${Math.round(2290/avg*100)}%</b></div></div>`,
    month:`<div class="chartcard"><header><h3>10월 일별 칼로리</h3>${crown}</header>${monthSvg}
      <div class="callout">이번 달 하루 평균 <b class="num">1,812kcal</b>, 목표 범위(90~110%) 안에 든 날은 <b class="num">13일</b>이에요.</div></div>`,
    ai:`<div class="chartcard report"><header><h3>AI 주간 리포트</h3>${crown}</header>
      <div class="score"><div class="big num">78<span>/100</span></div><div><b>균형 잡힌 한 주였어요</b><br><span class="aitag">AI 분석</span> <span style="font-size:13px;color:var(--ink-2)">10.19 – 10.25</span></div></div>
      <h4>잘한 점</h4><ul><li>7일 중 6일을 빠짐없이 기록했어요</li><li>평일 점심 탄단지 비율이 목표에 가까웠어요</li></ul>
      <h4>아쉬운 점</h4><ul><li>주말 저녁 칼로리가 목표보다 20% 이상 많았어요</li><li>단백질이 하루 평균 22g 부족했어요</li></ul>
      <h4>다음 주 제안</h4><ul><li>아침에 삶은 달걀이나 그릭요거트를 더해 보세요</li><li>주말 외식은 밥 양을 2/3로 줄여 보세요</li></ul></div>`

  return `<div class="screen">${bar('기록 보기',back())}

    ${monthGrid('day',state.calNut)}
    ${state.calNut==='w'?'<div class="legendrow">체중을 기록한 날에 kg으로 표시돼요</div>':`<div class="legendrow"><span><i style="background:var(--heat1)"></i>~50%</span><span><i style="background:var(--heat2)"></i>50~90%</span><span><i style="background:var(--heat3)"></i>90~110%</span><span><i style="background:var(--heat4)"></i>110%~</span></div>`}
    <div class="nchips">${[['kcal','칼로리'],['c','탄'],['p','단'],['f','지'],['w','몸무게']].map(([k,l])=>`<button class="nchip" aria-pressed="${state.calNut===k}" data-set="calNut:${k}">${l}</button>`).join('')}</div>
    <div class="segment" role="tablist" style="margin-top:26px">

    ${panes[state.statTab]}

}

  <div class="dots"><div>${slides.map((_,i)=>`<button aria-label="${i+1}번째 소개" data-dot="${i}" aria-current="${i===0}"></button>`).join('')}</div></div></div>
  <div class="bottom"><div class="inner pad" style="flex-direction:column;gap:2px"><button class="btn ink" data-go="consent">시작하기</button><button class="link" data-login="existing">이미 계정이 있어요</button></div></div>`;
}

const AGREE=[['svc','서비스 이용 안내 (의학적 조언이 아니에요)',1],['priv','개인정보 수집·이용',1],['ai','사진 AI 분석',1],['age','만 14세 이상이에요',1],['keep','식사 사진 보관',0],['school','학교 등록',0]];
function consent(){
  const a=state.agree,all=AGREE.every(i=>a[i[0]]),ok=AGREE.filter(i=>i[2]).every(i=>a[i[0]]);
  const cb=on=>`<span class="cbox ${on?'on':''}" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 8.5l2.5 2.5L12 5.5"/></svg></span>`;
  return `<div class="screen">${bar('',back('intro'))}<div class="pad q"><h2>서비스 이용에<br>동의해 주세요</h2><p class="help">처음 한 번만 확인하면 돼요</p>
  <div class="allagree"><div class="arow"><button class="lbl" data-agreeall="1" aria-pressed="${all}">${cb(all)}전체 동의</button></div></div>
  ${AGREE.map(([k,l,r])=>`<div class="arow"><button class="lbl" data-agree="${k}" aria-pressed="${!!a[k]}">${cb(a[k])}<span class="${r?'tagreq':'tagopt'}">${r?'필수':'선택'}</span><span>${l}</span></button>${k==='age'?'':`<button class="view" data-terms="${k}">보기</button>`}</div>`).join('')}</div>
  <div class="bottom"><div class="inner pad"><button class="btn ink" data-go="quiz" ${ok?'':'disabled'}>동의하고 계속</button></div></div></div>`;
}

function quiz(){
  const steps=obSteps(),i=Math.min(state.step,steps.length-1),k=steps[i],P=state.prof,last=i===steps.length-1;
  const opt=(f,v,l,s='')=>`<button class="opt" data-pick="${f}:${v}" aria-pressed="${P[f]===v}"><span>${l}${s?`<small>${s}</small>`:''}</span></button>`;
  const num=(f,u,ph)=>`<div class="field"><input id="f-${f}" data-field="${f}" type="number" inputmode="decimal" value="${P[f]}" placeholder="${ph}" aria-label="${u}"><span>${u}</span></div>`;
  const note='<div class="note">목표 계산에만 쓰고 언제든 수정·삭제할 수 있어요</div>';
  const B={
    sex:['성별을 알려주세요','하루에 필요한 칼로리를 계산할 때 써요',`<div class="opts two">${opt('sex','f','여성')}${opt('sex','m','남성')}</div>`],
    age:['나이를 알려주세요','만 나이로 적어 주세요',num('age','세','24')],
    height:['키를 알려주세요','',num('height','cm','165')+note],
    weight:['몸무게를 알려주세요','',num('weight','kg','58.0')+note],
    act:['평소 얼마나 움직이나요?','가장 가까운 것을 골라 주세요',`<div class="opts">${opt('act','1','거의 안 움직여요','주로 앉아서 지내요')}${opt('act','2','가볍게 움직여요','주 1~3회 가벼운 운동')}${opt('act','3','보통이에요','주 3~5회 운동')}${opt('act','4','활발해요','주 6~7회 운동')}${opt('act','5','매우 활발해요','운동선수 수준')}</div>`],
    goal:['목표가 무엇인가요?','',`<div class="opts">${opt('goal','lose','체중 감량')}${opt('goal','keep','체중 유지')}${opt('goal','gain','체중 증량')}</div>`],
    school:['학교를 등록할까요?','등록하면 급식 메뉴를 바로 불러올 수 있어요 (선택)',`<div class="field" style="border-color:var(--line)"><input id="f-school" data-field="school" type="text" value="${P.school}" placeholder="학교 이름 검색" aria-label="학교 이름" style="font-size:22px"></div>`]
  }[k];
  return `<div class="screen"><div class="pad"><div class="topbar">${i>0?`<button class="iconbtn" aria-label="이전" data-stepprev="1">${ico.back}</button>`:back('consent')}<div></div><div style="width:44px"></div></div>
  <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${i+1}"><div class="pfill" data-to="${(i+1)/steps.length*100}"></div><div class="pticks">${steps.slice(1).map((_,j)=>`<i style="left:${(j+1)/steps.length*100}%"></i>`).join('')}</div></div>
  <div class="q"><h2>${B[0]}</h2><p class="help">${B[1]}</p>${B[2]}</div></div>
  <div class="bottom"><div class="inner pad">${i>0?'<button class="btn ghost narrow" data-stepprev="1">이전</button>':''}${k==='school'?'<button class="btn ghost narrow" data-stepnext="1">건너뛰기</button>':''}<button class="btn ink" data-stepnext="1">${last?'결과 보기':'다음'}</button></div></div></div>`;

function result(){
  const m=(c,l,v)=>`<div><span class="dot" style="background:${c};display:inline-block;margin-right:4px"></span>${l}<div class="num">${v}</div></div>`;
  return `<div class="screen">${bar('',`<button class="iconbtn" aria-label="이전" data-go="quiz">${ico.back}</button>`)}<div class="pad"><div class="q"><h2>이렇게 먹는 걸<br>추천해요</h2><p class="help">입력한 정보로 계산했어요. 설정에서 언제든 바꿀 수 있어요</p></div>

const COACH=[['.meals','여기를 눌러 식사를 기록해요'],[null,'사진은 이렇게 찍어요'],['[data-go="calendar"]','달력과 그래프로 기록을 확인해요']];
function drawCoach(scroll){
  const box=document.getElementById('coach');
  if(state.screen!=='home'||state.coach==null){box.hidden=true;box.innerHTML='';return}
  const [sel,txt]=COACH[state.coach];
  if(!sel){
    const ck='<span class="tck" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 8.5l2.5 2.5L12 5.5"/></svg></span>';
    const tips=['위에서 내려다보듯 수직으로 찍어요','먹기 전·후는 같은 각도와 거리에서 찍어요. 먹은 후엔 먹기 전 사진이 반투명하게 겹쳐 보여요','그릇이 모두 화면 안에 들어오게 해요','밝은 곳에서, 손이나 폰 그림자가 음식을 가리지 않게 해요'].map(t=>`<li>${ck}<span>${t}</span></li>`).join('');
    box.innerHTML=`<div class="coach-block" style="background:rgba(31,42,46,.58)"></div><div class="coach-modal" role="dialog" aria-label="촬영 요령"><h3>${txt}</h3><div class="shots"><div class="shot">${foodPhoto(false)}<span>먹기 전</span></div><div class="shot">${foodPhoto(true)}<span>먹은 후</span></div></div><ul class="tips">${tips}</ul><div class="crow"><button class="link" data-coachskip="1">건너뛰기</button><span class="num" style="color:var(--ink-3)">${state.coach+1} / ${COACH.length}</span><button class="btn lime" style="min-height:44px" data-coachnext="1">다음</button></div></div>`;
    box.hidden=false;return;
  }
  const el=app.querySelector(sel);if(!el)return;
  if(scroll)el.scrollIntoView({block:'center'});
  requestAnimationFrame(()=>{
    const r=el.getBoundingClientRect(),p=8,below=r.bottom+190<innerHeight;
    const top=below?r.bottom+p+12:Math.max(12,r.top-p-12-140);
    const left=Math.min(Math.max(16,r.left),innerWidth-316);
    box.innerHTML=`<div class="coach-block"></div><div class="coach-hole" style="left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px"></div><div class="coach-tip" role="dialog" aria-label="사용방법" style="top:${top}px;left:${Math.max(16,left)}px"><p>${txt}</p><div class="crow"><button class="link" data-coachskip="1">건너뛰기</button><span class="num" style="color:var(--ink-3)">${state.coach+1} / ${COACH.length}</span><button class="btn lime" style="min-height:44px" data-coachnext="1">${state.coach<COACH.length-1?'다음':'시작하기'}</button></div></div>`;
    box.hidden=false;
  });
}
addEventListener('scroll',()=>{if(state.coach!=null&&state.screen==='home')drawCoach(false)},{passive:true});
addEventListener('resize',()=>{if(state.coach!=null&&state.screen==='home')drawCoach(false)});

const TERMS={
  svc:['서비스 이용 안내',[['어떤 서비스인가요',['식사 사진으로 먹은 양과 영양소를 기록하도록 돕는 서비스예요.','의학적 진단이나 치료, 영양 상담을 대신하지 않아요.']],['알아두세요',['사진으로 계산한 칼로리와 영양소는 추정치라 실제와 다를 수 있어요. 결과는 언제든 직접 고칠 수 있어요.','질환이 있거나 임신·수유 중이라면 목표를 정하기 전에 의사나 영양사와 상담해 주세요.','왕관이 붙은 기능은 프리미엄 기능이에요.']]]],
  priv:['개인정보 수집·이용',[['수집하는 정보',['구글 계정의 이름과 이메일','성별, 나이, 키, 몸무게, 활동량, 목표','식사 기록(음식, 양, 먹은 시간)과 체중 기록']],['쓰는 곳',['하루 목표 칼로리와 탄·단·지 계산','기록 저장, 달력·그래프 통계, 여러 기기에서 같은 기록 보기']],['보관 기간',['탈퇴하거나 설정에서 「내 기록 전체 삭제」를 하면 바로 삭제해요.']],['동의하지 않으면',['동의하지 않을 수 있지만, 이 정보 없이는 기록과 목표 계산을 할 수 없어요.']]]],
  ai:['사진 AI 분석',[['어떻게 분석하나요',['찍은 사진을 AI(Google Gemini)로 보내 음식 종류와 양을 찾아요.','영양 수치는 식약처 식품영양성분 데이터를 기준으로 계산해요.']],['사진은 어떻게 되나요',['분석에만 쓰고, 「식사 사진 보관」에 동의한 경우에만 앱에 남겨요.','얼굴이나 개인정보가 적힌 물건이 찍히지 않게 해 주세요.']],['결과가 틀리면',['음식 이름, 무게, 남긴 양을 직접 고칠 수 있어요. 확실하지 않은 값에는 「추정」 표시가 붙어요.']]]],
  keep:['식사 사진 보관',[['무엇을 보관하나요',['먹기 전·후 사진을 보관해서 기록 상세와 식단 앨범에서 다시 볼 수 있어요.']],['언제든 바꿀 수 있어요',['설정에서 보관을 끄거나 사진을 한 번에 지울 수 있어요.','동의하지 않아도 기록은 그대로 쓸 수 있고, 식단 앨범만 보이지 않아요.']]]],
  school:['학교 등록',[['왜 필요한가요',['등록한 학교의 공개 급식 메뉴를 불러와서, 급식을 먹은 날 한 번에 기록할 수 있어요.']],['저장하는 정보',['학교 이름만 저장하고, 학년·반·번호는 받지 않아요.','설정에서 언제든 해제할 수 있어요.']]]]
};
const sheets={
  kcal:()=>`<header><h2>하루 목표 칼로리</h2><button class="iconbtn" aria-label="닫기" data-kcalsave="1">${ico.close}</button></header><div style="margin-top:10px">${kcalEditor()}</div><button class="btn ink" style="width:100%;margin-top:16px" data-kcalsave="1">저장</button>`,
  terms:()=>{const [t,secs]=TERMS[state.termsKey],k=state.termsKey;return `<header><h2>${t}</h2><button class="iconbtn" aria-label="닫기" data-close>${ico.close}</button></header><div class="terms">${secs.map(([h,items])=>`<h4>${h}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`).join('')}</div><button class="btn ink" style="width:100%;margin-top:18px" data-agreeon="${k}">${state.agree[k]?'확인':'동의하기'}</button>`},
  goaltype:()=>`<header><h2>목표</h2><button class="iconbtn" aria-label="닫기" data-close>${ico.close}</button></header><p style="color:var(--ink-2);margin:6px 0 0">바꾸면 하루 추천 칼로리와 탄·단·지도 다시 계산해요</p><div class="opts" style="margin-top:14px">${[['lose','체중 감량'],['keep','체중 유지'],['gain','체중 증량']].map(([v,l])=>`<button class="opt" data-goalset="${v}" aria-pressed="${state.prof.goal===v}">${l}</button>`).join('')}</div>`,
  goalpick:()=>`<header><h2>이미 저장된 목표가 있어요</h2><button class="iconbtn" aria-label="닫기" data-close>${ico.close}</button></header><p style="color:var(--ink-2);margin:6px 0 0">이 계정에는 하루 1,800kcal 목표가 있어요. 어떻게 할까요?</p><div class="choice"><button data-startcoach="1">기존 목표 유지 (1,800kcal)</button><button data-startcoach="1">방금 입력한 값으로 바꾸기 (1,900kcal)</button></div><p style="font-size:13px;color:var(--ink-3);margin:12px 0 0">시안 안내: 목표가 이미 있는 계정으로 로그인했을 때만 보여요</p>`,
  record:()=>`<header><h2>식사 기록</h2><button class="iconbtn" aria-label="닫기" data-close>${ico.close}</button></header>
    <div class="school"><p>오늘 점심 급식인가요?</p><button class="chipbtn" style="background:var(--butter)" data-close data-toast="급식 메뉴를 불러왔어요">급식 불러오기</button></div>
    <div class="choice"><button data-close data-toast="카메라가 열려요">${ico.camera}카메라로 찍기</button><button data-close data-toast="사진첩이 열려요">${ico.image}앨범에서 고르기</button><button data-close data-toast="음식 검색이 열려요">${ico.pen}직접 입력</button></div>`,

    <label for="mtime" style="display:block;margin:12px 0 6px;color:var(--ink-2);font-size:14px">${meals[state.mealKey].name} 시간</label>
    <input id="mtime" type="time" value="${meals[state.mealKey].time||'19:00'}" style="width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font:600 20px var(--f-num)">
    <button class="btn ink" style="width:100%;margin-top:16px" data-close data-toast="시간을 저장했어요">저장</button>`,
  mealinfo:()=>`<header><h2>${meals[state.mealKey].name} 영양정보</h2><button class="iconbtn" aria-label="닫기" data-close>${ico.close}</button></header>${nutrientTable(totals(meals[state.mealKey].foods),true)}`
};
function refresh(){render();if(!document.getElementById('overlay').hidden&&state.sheet)openSheet(state.sheet)}
function openSheet(k){state.sheet=k;const o=document.getElementById('overlay');document.getElementById('sheet').innerHTML=sheets[k]();o.hidden=false}
function closeSheet(){document.getElementById('overlay').hidden=true}

const screens={home,glance,detail,meal,recommend,calendar,album,settings,intro,consent,quiz,result};
let lastScreen=null;
function render(){
  goal=calcGoal();
  document.documentElement.classList.toggle('lock',state.screen==='intro');
  app.innerHTML=screens[state.screen]();
  const pf=app.querySelector('.pfill');
  if(pf){pf.style.transition='none';pf.style.width=(state.progFrom||0)+'%';pf.offsetWidth;pf.style.transition='';pf.style.width=pf.dataset.to+'%';state.progFrom=+pf.dataset.to}
  if(lastScreen!==state.screen){const sc=app.querySelector('.screen');if(sc)sc.classList.add('enter');lastScreen=state.screen}
  const sl=document.getElementById('slides');
  if(sl)sl.addEventListener('scroll',()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);document.querySelectorAll('.dots button').forEach((b,j)=>b.setAttribute('aria-current',j===i))},{passive:true});
  drawCoach(true);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-go]');if(!el)return;
  if(el.id==='overlay')return;
  if(el.dataset.meal){go('meal',{mealKey:el.dataset.meal});return}
  if(el.dataset.day){go('home');toast(`10월 ${el.dataset.day}일로 이동`);return}
  if(el.dataset.albumday){state.albumDay=+el.dataset.albumday;render();return}
  if(el.dataset.kcal){state.kcalCustom=Math.max(800,goal.kcal+(+el.dataset.kcal));refresh();return}
  if(el.dataset.kcalreset){state.kcalCustom=null;refresh();return}
  if(el.dataset.kcalsave){closeSheet();render();toast('목표를 저장했어요');return}
  if(el.dataset.terms){state.termsKey=el.dataset.terms;openSheet('terms');return}
  if(el.dataset.agreeon){const k=el.dataset.agreeon;state.agree[k]=true;if(k==='keep')state.photoKeep=true;closeSheet();render();return}
  if(el.dataset.goalset){state.prof.goal=el.dataset.goalset;closeSheet();render();toast('목표를 바꿨어요');return}
  if(el.dataset.coachnext){state.coach=state.coach<COACH.length-1?state.coach+1:null;drawCoach(true);return}
  if(el.dataset.coachskip){state.coach=null;drawCoach();return}
  if(el.dataset.startcoach){closeSheet();go('home',{coach:0});return}
  if(el.dataset.login){toast('구글 로그인 화면이 열려요 (시안)');if(el.dataset.login==='new')openSheet('goalpick');else go('home',{coach:0});return}
  if(el.dataset.agreeall){const all=AGREE.every(i=>state.agree[i[0]]);AGREE.forEach(i=>state.agree[i[0]]=!all);state.photoKeep=!!state.agree.keep;render();return}
  if(el.dataset.agree){const k=el.dataset.agree;state.agree[k]=!state.agree[k];if(k==='keep')state.photoKeep=!!state.agree.keep;render();return}
  if(el.dataset.pick){const [f,v]=el.dataset.pick.split(':');state.prof[f]=v;render();return}
  if(el.dataset.stepnext){if(state.step>=obSteps().length-1)go('result');else{state.step++;render()}return}
  if(el.dataset.stepprev){state.step=Math.max(0,state.step-1);render();return}
  if(el.dataset.dot!=null){const s=document.getElementById('slides');s.scrollTo({left:+el.dataset.dot*s.clientWidth,behavior:'smooth'});return}
  if(el.dataset.skip){const k=el.dataset.skip;state.skip[k]=!state.skip[k];render();return}
  if(el.dataset.toggle){const k=el.dataset.toggle;state[k]=!state[k];render();toast(state[k]?'사진 보관을 켰어요':'사진 보관을 꺼어요');return}
  if(el.dataset.set){const [k,v]=el.dataset.set.split(':');state[k]=v;render();return}
  if(el.dataset.sheet){openSheet(el.dataset.sheet);return}
  if(el.hasAttribute('data-close'))closeSheet();
  if(el.dataset.go)go(el.dataset.go);
  if(el.dataset.toast)toast(el.dataset.toast);
});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.kcalinput){const v=parseInt(e.target.value,10);if(v>=800&&v<=6000)state.kcalCustom=v;refresh()}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.field;if(f)state.prof[f]=e.target.value});
render();
</script>
